services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: 1000
    volumes:
      - type: bind
        source: .
        target: /usr/src/app
        consistency: cached
      - ../picture_server_data:/data

    environment:
      PYTHONPATH: '/usr/src/app/src'
    env_file:
      - .env
